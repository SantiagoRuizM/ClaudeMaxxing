<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oficina virtual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --ink: #EEF3F7; --muted: #A9B6C3; --glass: rgba(11, 17, 26, 0.72); --line: rgba(255, 255, 255, 0.1);
      --blue: #2F93D6; --green: #3CC0A9; --gold: #F2C14E;
      --font: "Google Sans Flex", "Segoe UI", system-ui, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0B1018; color: var(--ink); font-family: var(--font); }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; touch-action: none; }
    .labels { position: absolute; inset: 0; pointer-events: none; }

    .tag { pointer-events: auto; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      font: 600 11px/1 var(--font); color: var(--ink); background: rgba(11, 17, 26, 0.82); padding: 4px 8px 4px 6px;
      border-radius: 999px; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 2px 8px rgba(0,0,0,.35); margin-bottom: 4px;
      transition: transform .15s, background .15s; }
    .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--team); }
    .tag i { font-style: normal; font-size: 12px; }
    .tag .r { color: var(--muted); font-weight: 500; }
    .tag.founder { font-size: 12.5px; padding: 5px 10px 5px 8px; background: rgba(242, 193, 78, .92); color: #1A1406; border-color: transparent; }
    .tag.founder .r { color: #5A4613; }
    .tag.founder::before { background: #1A1406; }
    .tag.dim { opacity: .55; }
    .tag:hover, .tag.sel { transform: scale(1.12); background: rgba(11, 17, 26, .95); border-color: var(--team); }
    .tag.founder:hover, .tag.founder.sel { background: #F2C14E; }
    .tag:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    body.far .tag:not(.founder) { display: none !important; }
    /* overview: agents show only a floating state icon, game style */
    body.mid .tag:not(.founder):not(.sel):not(:hover) { padding: 0; background: none; border-color: transparent; box-shadow: none; }
    body.mid .tag:not(.founder):not(.sel):not(:hover)::before, body.mid .tag:not(.founder):not(.sel):not(:hover) b { display: none; }
    body.mid .tag:not(.founder):not(.sel):not(:hover) i { font-size: 17px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.65)); }
    body.no-labels .tag { display: none !important; }
    body.vfar .tag { display: none !important; }
    .room { display: none; font: 700 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: #fff;
      background: rgba(0, 105, 171, .82); padding: 5px 8px; border-radius: 4px; white-space: nowrap; }
    body.plan .room { display: block; }

    .hud { position: fixed; z-index: 5; background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--line); border-radius: 16px; }
    .brand { top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); padding: 14px 18px; display: grid; gap: 8px; max-width: min(360px, calc(100vw - 32px)); }
    .brand img { height: 26px; width: auto; display: block; }
    .brand img[hidden], .brand strong[hidden] { display: none; }
    .brand strong { font-size: 19px; letter-spacing: .01em; }
    .brand .where { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .brand .where b { color: var(--ink); font-weight: 600; }
    #clock { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 600; }
    #mood { margin: 0; font-size: 13px; color: var(--ink); line-height: 1.4; }

    .stats { top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); padding: 10px; display: grid; grid-template-columns: repeat(5, auto); gap: 4px; }
    .stat { display: grid; justify-items: center; gap: 2px; padding: 6px 10px; border-radius: 10px; min-width: 64px; }
    .stat b { font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .stat span { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .stat.work b { color: var(--green); }

    .controls { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); padding: 6px; display: flex; gap: 4px; }
    .controls button { all: unset; cursor: pointer; font: 600 13px/1 var(--font); color: var(--ink); padding: 10px 14px; border-radius: 11px; white-space: nowrap; }
    .controls button:hover { background: rgba(255,255,255,.08); }
    .controls button[aria-pressed="true"] { background: rgba(47, 147, 214, .3); color: #fff; }
    .hint { position: fixed; z-index: 4; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); font-size: 12px; color: rgba(255,255,255,.75); text-shadow: 0 1px 4px rgba(0,0,0,.7); white-space: nowrap; }

    #panel { top: calc(108px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: min(340px, calc(100vw - 32px)); padding: 18px 18px 16px; display: grid; gap: 10px; border-top: 3px solid var(--team); }
    #panel[hidden] { display: none; }
    #p-close { all: unset; cursor: pointer; position: absolute; top: 10px; right: 12px; font-size: 20px; color: var(--muted); padding: 2px 6px; }
    #p-team { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--team); font-weight: 700; }
    #p-name { margin: 0; font-size: 21px; line-height: 1.15; text-wrap: balance; padding-right: 24px; }
    #p-role { margin: 0; font-size: 13px; color: var(--muted); }
    .state { display: grid; gap: 4px; background: rgba(255,255,255,.05); border-radius: 12px; padding: 10px 12px; }
    #p-state { display: flex; gap: 8px; align-items: center; font-size: 14px; }
    #p-state i { font-style: normal; font-size: 18px; }
    #p-text { margin: 0; font-size: 13.5px; }
    #p-hint { margin: 0; font-size: 12.5px; color: var(--muted); }
    #p-hint:empty { display: none; }
    #panel h3 { margin: 2px 0 -4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    #p-does { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13.5px; }
    #p-src { margin: 0; font-size: 11.5px; color: var(--muted); }

    .loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #0B1018; transition: opacity .8s; }
    .loading i { width: 44px; height: 44px; border-radius: 50%; background: var(--green); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .4; transform: scale(.94); } }
    body.ready .loading { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .loading i { animation: none; } }

    @media (max-width: 860px) {
      .stats { top: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); left: 50%; right: auto; transform: translateX(-50%); grid-template-columns: repeat(5, auto); }
      .stat { min-width: 0; padding: 4px 6px; } .stat b { font-size: 16px; } .stat span { font-size: 10px; }
      .hint { display: none; }
      #panel { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); max-height: 50vh; overflow: auto; }
      .brand { padding: 10px 14px; } #mood { display: none; }
      .controls button { padding: 9px 10px; font-size: 12px; }
    }
    body.shot .hint, body.shot .loading { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="loading" role="status" aria-label="Cargando la oficina"><i></i></div>

  <header class="hud brand">
    <img id="logo" alt="" hidden><strong id="company"></strong>
    <div class="where"><b>Oficina virtual</b><span id="place"></span><span id="clock">--:--</span></div>
    <p id="mood"></p>
  </header>

  <section class="hud stats" aria-label="Estado del equipo">
    <div class="stat work"><b id="s-work">0</b><span>Trabajando</span></div>
    <div class="stat"><b id="s-sleep">0</b><span>💤 Durmiendo</span></div>
    <div class="stat"><b id="s-phone">0</b><span>📱 Celular</span></div>
    <div class="stat"><b id="s-break">0</b><span>☕ Descanso</span></div>
    <div class="stat"><b id="s-absent">0</b><span>🚫 No vino</span></div>
  </section>

  <aside class="hud" id="panel" hidden>
    <button id="p-close" aria-label="Cerrar">×</button>
    <div id="p-team"></div>
    <h2 id="p-name"></h2>
    <p id="p-role"></p>
    <div class="state"><div id="p-state"></div><p id="p-text"></p><p id="p-hint"></p></div>
    <h3>Qué hace</h3>
    <ul id="p-does"></ul>
    <p id="p-src"></p>
  </aside>

  <div class="hint">Arrastra para girar · Rueda para acercar · Toca a alguien para ver qué hace</div>
  <nav class="hud controls" aria-label="Vista">
    <button id="b-home" type="button">Oficina</button>
    <button id="b-plan" type="button" aria-pressed="false">Plano</button>
    <button id="b-time" type="button">Hora real</button>
    <button id="b-labels" type="button" aria-pressed="true">Etiquetas</button>
    <button id="b-full" type="button">Pantalla completa</button>
  </nav>

  <script>if (location.search.includes('shot')) document.body.classList.add('shot');</script>
  <!-- No build step: the same files run from the tray (localhost) and from Cloudflare Pages. -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>

name: CI

# On pull requests, not on each push. Also called by release.yml, so a release runs exactly these tests.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The Whip and Peek tests import their .ts modules directly (Node strips the types).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tray, slots, installer and menu package tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test\run-tests.ps1

      - name: Every window and section draws (the hub, the popup, Otros PCs, the approval dialog)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test\render-hub.ps1

      - name: Voice tests (no audio)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File voice\test\run-tests.ps1

      - name: Ambientes (harness) plan cases and the native host
        shell: cmd
        run: node harness\test.js

      - name: Maxx Whip rules (the shell guard)
        shell: cmd
        run: node --test whip\test\rules.test.mjs

      - name: Peek paths (Windows, Linux and WSL)
        shell: cmd
        run: node --test peek\test\paths.test.mjs

      - name: Virtual office (team layout, city and style presets, every scene built in node)
        shell: cmd
        run: node --test office/test/*.test.mjs

      - name: Menu DLL and stub build from source
        shell: cmd
        run: menu\build.cmd
